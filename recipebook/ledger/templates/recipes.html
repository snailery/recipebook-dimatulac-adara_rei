{% extends 'base.html' %}
{% load static %}

{% block title %}Recipes{% endblock %}
{% block content %}
  {% if request.user.is_authenticated %}
    <button onclick="document.location='{% url 'ledger:add-recipe' %}'">Add Recipe</button>
  {% endif %}

  <uL>
      {% for recipe in recipe_list %}
      <li><a href="{% url 'ledger:recipe' recipe.pk %}">{{ recipe }}</a></li>
      {% endfor %}
  </uL>
{% endblock %}
